[project]
name = "kuroko-backend"
version = "0.4.0"
description = "Kuroko - 基于 OpenList 的磁力链接番号管理与离线下载系统"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
