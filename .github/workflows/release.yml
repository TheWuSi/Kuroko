name: Docker Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify Release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and Publish Image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            KUROKO_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kuroko-image
          cache-to: type=gha,mode=max,scope=kuroko-image

      - name: Verify Published Platforms
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" --raw | python3 -c '
          import json
          import sys

          manifest = json.load(sys.stdin)
          platforms = {
              item["platform"]["os"] + "/" + item["platform"]["architecture"]
              for item in manifest["manifests"]
          }
          missing = {"linux/amd64", "linux/arm64"} - platforms
          if missing:
              sys.exit("Missing image platforms: " + ", ".join(sorted(missing)))
          print("Verified linux/amd64 and linux/arm64 images")
          '
